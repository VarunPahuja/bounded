# Render blueprint for the Bounded dashboard API (docs/MASTER.md section
# 2). Free tier, deliberately unoptimized (cold starts included) --
# the README's live link exists so the repo has a working URL, not so
# the recorded demo runs against it (docs/LOG.md, deploy entry).
#
# Deploy: Render dashboard -> New -> Blueprint -> this repo. The five
# envVars below with `sync: false` are prompted for at setup, not read
# from this file -- nothing secret is committed here.
services:
  - type: web
    name: bounded-api
    runtime: python
    plan: free
    buildCommand: pip install -e ".[api,verifier,rail,ledger,llm]"
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_DEPLOYMENT
        sync: false
      - key: CORS_EXTRA_ORIGIN
        sync: false
